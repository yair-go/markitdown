[project]
name = "web-converter"
version = "0.1.0"
description = "Local web app for converting files to Markdown with MarkItDown"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "markitdown[all]",
    "playwright>=1.65.2",
]

[tool.uv]
package = false

[tool.uv.sources]
# Use the MarkItDown package from this repository (editable).
markitdown = { path = "../../packages/markitdown", editable = true }
