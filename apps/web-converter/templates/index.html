<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ממיר ל-Markdown</title>
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    const t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085;
  --border: #dde1e8; --accent: #2f6fed; --accent-soft: #e8f0ff; --err: #c0362c;
  --code: #f2f4f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b1f27; --text: #e6e9ef; --muted: #98a2b3;
    --border: #2c3340; --accent: #6c9bff; --accent-soft: #1f2b45; --err: #ff7b72;
    --code: #232935;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b1f27; --text: #e6e9ef; --muted: #98a2b3;
  --border: #2c3340; --accent: #6c9bff; --accent-soft: #1f2b45; --err: #ff7b72;
  --code: #232935;
}
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.theme { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.theme button { border: 0; border-radius: 0; padding: 6px 12px; font-size: 13px; }
.theme button + button { border-inline-start: 1px solid var(--border); }
.theme button[aria-pressed="true"] { background: var(--accent); color: #fff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, "Segoe UI", Arial, sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { margin: 0 0 4px; font-size: 26px; }
.sub { color: var(--muted); margin: 0 0 24px; }
.drop { border: 2px dashed var(--border); border-radius: 14px; background: var(--card);
  padding: 40px 16px; text-align: center; cursor: pointer; transition: .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { display: block; font-size: 18px; margin-bottom: 6px; }
.drop span { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
input[type=url] { flex: 1; min-width: 220px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; }
button { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.folder { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--card);
  border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
.folder .path { font-weight: 600; overflow-wrap: anywhere; }
.folder .hint { color: var(--muted); font-size: 13px; }
.folder label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.saved { color: var(--muted); font-size: 12px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 8px; }
.status { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  margin-bottom: 16px; overflow: hidden; }
.card header { display: flex; gap: 8px; align-items: center; padding: 10px 14px;
  border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card header .name { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.card header button { padding: 5px 10px; font-size: 13px; }
.tabs button.active { background: var(--accent-soft); border-color: var(--accent); }
.card .err { color: var(--err); padding: 14px; }
.body { display: grid; }
.body.split { grid-template-columns: 1fr 1fr; }
.body.split > .rendered { border-inline-start: 1px solid var(--border); }
@media (max-width: 700px) { .body.split { grid-template-columns: 1fr; } .body.split > .rendered { border-inline-start: 0; border-top: 1px solid var(--border); } }
textarea.raw { display: block; width: 100%; height: 480px; min-height: 160px; margin: 0; padding: 14px; border: 0;
  resize: vertical; background: var(--code); color: var(--text); font: 13px/1.5 Consolas, monospace; }
textarea.raw:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
textarea.raw[hidden], .rendered[hidden] { display: none; }
.rendered { padding: 4px 20px; height: 480px; overflow: auto; min-width: 0; }
.edited { font-size: 12px; color: var(--accent); font-weight: 600; }
.rendered table { border-collapse: collapse; }
.rendered th, .rendered td { border: 1px solid var(--border); padding: 4px 8px; }
.rendered img { max-width: 100%; }
.rendered pre, .rendered code { background: var(--code); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>ממיר קבצים ל-Markdown</h1>
    <div class="theme" role="group" aria-label="ערכת נושא">
      <button type="button" data-theme-choice="auto">אוטומטי</button>
      <button type="button" data-theme-choice="light">בהיר</button>
      <button type="button" data-theme-choice="dark">כהה</button>
    </div>
  </div>
  <p class="sub">PDF, Word, PowerPoint, Excel, HTML, CSV, JSON, EPUB, ZIP ועוד — מבוסס MarkItDown, רץ מקומית במחשב שלך.</p>

  <div class="drop" id="drop">
    <strong>גרור לכאן קבצים</strong>
    <span>או לחץ כדי לבחור (אפשר כמה קבצים יחד)</span>
    <input type="file" id="file" multiple hidden>
  </div>

  <form class="row" id="urlForm">
    <input type="url" id="url" placeholder="או הדבק כתובת אתר / YouTube / ויקיפדיה" dir="ltr">
    <button class="primary" type="submit">המר כתובת</button>
  </form>

  <div class="folder" id="folderBox">
    <button type="button" id="pickFolder">בחר תיקייה לשמירה</button>
    <span class="hint" id="folderName">לא נבחרה תיקייה</span>
    <label><input type="checkbox" id="autoSave" disabled> שמור אוטומטית כל המרה לתיקייה</label>
  </div>

  <div class="toolbar">
    <span class="status" id="status"></span>
    <span>
      <button id="saveAll" disabled>שמור הכול לתיקייה</button>
      <button id="zipAll" disabled>הורד הכול (ZIP)</button>
      <button id="clear" disabled>נקה</button>
    </span>
  </div>

  <section id="results"></section>
</main>

<script>
const $ = s => document.querySelector(s);
const results = [];
const drop = $("#drop"), fileInput = $("#file"), status = $("#status");

// Theme switcher: auto (follow system) / light / dark, remembered per browser.
const themeButtons = document.querySelectorAll("[data-theme-choice]");
function setTheme(choice) {
  if (choice === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = choice;
  themeButtons.forEach(b => b.setAttribute("aria-pressed", b.dataset.themeChoice === choice));
  try { choice === "auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", choice); } catch (e) {}
}
themeButtons.forEach(b => b.onclick = () => setTheme(b.dataset.themeChoice));
setTheme(document.documentElement.dataset.theme || "auto");

drop.onclick = () => fileInput.click();
fileInput.onchange = () => { upload(fileInput.files); fileInput.value = ""; };
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => upload(ev.dataTransfer.files));

$("#urlForm").onsubmit = async ev => {
  ev.preventDefault();
  const url = $("#url").value.trim();
  if (!url) return;
  await run(() => fetch("/api/convert-url", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({url})
  }), "ממיר כתובת…");
  $("#url").value = "";
};

async function upload(files) {
  if (!files || !files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append("files", f);
  await run(() => fetch("/api/convert", {method: "POST", body: fd}), `ממיר ${files.length} קבצים…`);
}

async function run(req, msg) {
  status.textContent = msg;
  try {
    const res = await req();
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    data.results.forEach(r => { results.push(r); render(r); });
    const ok = data.results.filter(r => !r.error).length;
    status.textContent = `הומרו ${ok} מתוך ${data.results.length}`;
    if (dirHandle && $("#autoSave").checked && ok) {
      const n = await saveToFolder(data.results.filter(r => !r.error));
      status.textContent += ` · נשמרו ${n} לתיקייה ${dirHandle.name}`;
    }
  } catch (e) {
    status.textContent = "שגיאה: " + e.message;
  }
  refreshButtons();
}

function refreshButtons() {
  $("#zipAll").disabled = !results.some(r => !r.error);
  $("#saveAll").disabled = !results.some(r => !r.error);
  $("#clear").disabled = !results.length;
}

function render(r) {
  const card = document.createElement("article");
  card.className = "card";
  const header = document.createElement("header");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = r.error ? r.source : `${r.source} ← ${r.name}`;
  header.append(name);
  card.append(header);

  if (r.error) {
    const e = document.createElement("div");
    e.className = "err"; e.textContent = r.error;
    card.append(e);
  } else {
    r.original = r.markdown;
    const body = document.createElement("div");
    body.className = "body";
    const raw = document.createElement("textarea");
    raw.className = "raw"; raw.dir = "auto"; raw.spellcheck = false; raw.value = r.markdown;
    raw.setAttribute("aria-label", "עריכת Markdown");
    const view = document.createElement("div");
    view.className = "rendered"; view.dir = "auto";
    body.append(raw, view);

    const renderView = () => {
      view.innerHTML = DOMPurify.sanitize(marked.parse(r.markdown));
      // Explicit per-block direction (from the first strong letter) so Hebrew and English
      // paragraphs, tables and lists each lay out correctly, in the preview and in the PDF.
      view.dir = textDir(view.textContent);
      view.querySelectorAll("p,h1,h2,h3,h4,h5,h6,li,ul,ol,table,th,td,blockquote")
        .forEach(el => { const d = textDir(el.textContent, null); if (d) el.dir = d; });  // no letters: inherit
    };
    let timer;
    raw.addEventListener("input", () => {
      r.markdown = raw.value;
      setEdited(r.markdown !== r.original);
      if (!view.hidden) { clearTimeout(timer); timer = setTimeout(renderView, 150); }
    });

    // Views: Markdown editor / rendered preview / side by side.
    const tabs = document.createElement("span");
    tabs.className = "tabs";
    const modes = {edit: "עריכה", view: "תצוגה", split: "מפוצל"};
    const tabBtns = {};
    const setMode = m => {
      raw.hidden = m === "view";
      view.hidden = m === "edit";
      body.classList.toggle("split", m === "split");
      if (!view.hidden) renderView();
      Object.entries(tabBtns).forEach(([k, b]) => b.classList.toggle("active", k === m));
    };
    Object.entries(modes).forEach(([k, label]) => { tabBtns[k] = btn(label, () => setMode(k)); tabs.append(tabBtns[k], " "); });
    setMode("edit");

    const edited = document.createElement("span");
    edited.className = "edited"; edited.textContent = "נערך"; edited.hidden = true;
    const revert = btn("בטל שינויים", () => {
      if (!confirm("לחזור לתוצאת ההמרה המקורית? השינויים שלך יימחקו.")) return;
      raw.value = r.markdown = r.original; setEdited(false); if (!view.hidden) renderView();
    });
    revert.hidden = true;
    function setEdited(on) { edited.hidden = revert.hidden = !on; }

    const copy = btn("העתק", async () => {
      await navigator.clipboard.writeText(r.markdown);
      copy.textContent = "הועתק ✓"; setTimeout(() => copy.textContent = "העתק", 1500);
    });
    const dl = btn("הורד .md", () => download(new Blob([r.markdown], {type: "text/markdown;charset=utf-8"}), r.name));
    const save = btn("שמור לתיקייה", async () => {
      try { if (await saveToFolder([r])) status.textContent = `נשמר: ${r.savedAs}`; }
      catch (e) { status.textContent = "שגיאה בשמירה: " + e.message; }
    });
    save.hidden = !folderSupported;
    r.badge = document.createElement("span");
    r.badge.className = "saved";
    const pdf = btn("הורד PDF", async () => {
      renderView();  // make sure the preview reflects the latest edits
      pdf.disabled = true; pdf.textContent = "יוצר PDF…";
      try {
        const res = await fetch("/api/pdf", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({name: r.name, title: r.title || r.name, html: view.innerHTML, dir: view.dir}),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        download(await res.blob(), r.name.replace(/\.md$/i, "") + ".pdf");
      } catch (e) { status.textContent = "שגיאה ביצירת PDF: " + e.message; }
      finally { pdf.disabled = false; pdf.textContent = "הורד PDF"; }
    });
    header.append(tabs, edited, revert, copy, dl, pdf, save, r.badge);
    card.append(body);
  }
  $("#results").prepend(card);
}

// "rtl" if the first strong letter is Hebrew/Arabic, "ltr" if Latin etc., else the fallback.
function textDir(text, fallback = "ltr") {
  const m = /[֐-ࣿיִ-﷿ﹰ-﻿]|[A-Za-zÀ-ɏͰ-ϿЀ-ӿ]/.exec(text);
  return m ? (/[A-Za-zÀ-ӿ]/.test(m[0]) ? "ltr" : "rtl") : fallback;
}

function btn(label, onClick) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label; b.onclick = onClick;
  return b;
}

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Save directly to a folder on disk (File System Access API: Chrome / Edge).
const folderSupported = "showDirectoryPicker" in window;
let dirHandle = null;
if (!folderSupported) {
  $("#folderBox").innerHTML = '<span class="hint">שמירה ישירה לתיקייה נתמכת רק ב-Chrome או Edge. כאן אפשר להוריד קבצים או ZIP.</span>';
  $("#saveAll").hidden = true;
} else {
  $("#pickFolder").onclick = async () => {
    try {
      dirHandle = await window.showDirectoryPicker({id: "md-out", mode: "readwrite"});
    } catch (e) {
      if (e.name !== "AbortError") status.textContent = "שגיאה: " + e.message;
      return;
    }
    $("#folderName").textContent = dirHandle.name;
    $("#folderName").className = "path";
    $("#pickFolder").textContent = "החלף תיקייה";
    $("#autoSave").disabled = false;
  };
}

async function ensureFolder() {
  if (!dirHandle) await $("#pickFolder").onclick();
  if (!dirHandle) return false;
  const opts = {mode: "readwrite"};
  if ((await dirHandle.queryPermission(opts)) === "granted") return true;
  return (await dirHandle.requestPermission(opts)) === "granted";
}

async function exists(name) {
  try { await dirHandle.getFileHandle(name); return true; } catch { return false; }
}

// Writes each result as <name>.md, adding " (1)", " (2)"... instead of overwriting
// other files. A result already saved to this folder overwrites its own file (e.g. after edits).
async function saveToFolder(items) {
  if (!(await ensureFolder())) return 0;
  let n = 0;
  for (const r of items) {
    const stem = r.name.replace(/\.md$/i, "");
    let name = r.name, i = 1;
    if (r.savedAs && r.savedDir === dirHandle) name = r.savedAs;
    else while (await exists(name)) name = `${stem} (${i++}).md`;
    const fh = await dirHandle.getFileHandle(name, {create: true});
    const w = await fh.createWritable();
    await w.write(r.markdown);
    await w.close();
    r.savedAs = name; r.savedDir = dirHandle;
    if (r.badge) r.badge.textContent = `נשמר כ-${name}`;
    n++;
  }
  return n;
}

$("#saveAll").onclick = async () => {
  try {
    const n = await saveToFolder(results.filter(r => !r.error));
    if (n) status.textContent = `נשמרו ${n} קבצים לתיקייה ${dirHandle.name}`;
  } catch (e) { status.textContent = "שגיאה בשמירה: " + e.message; }
};

$("#zipAll").onclick = async () => {
  const items = results.filter(r => !r.error).map(r => ({name: r.name, markdown: r.markdown}));
  const res = await fetch("/api/zip", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({items})});
  download(await res.blob(), "markdown.zip");
};

$("#clear").onclick = () => {
  results.length = 0; $("#results").innerHTML = ""; status.textContent = ""; refreshButtons();
};
</script>
</body>
</html>
